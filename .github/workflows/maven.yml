---
name: java-maven workflow

on: 
  push:
    branches: [main]

env: 
  APP_NAME: GitHub Actions CI

jobs:
  build:
    runs-on: ubuntu-latest
    
    outputs:
      app-version: ${{ steps.appversion.outputs.version }} 

    steps:
      - name: getting sourcecode
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: getting Application name
        run: echo "Application name is $APP_NAME"

      - name: set application version
        id: appversion
        run: echo "version=1.0.0" >> "$GITHUB_OUTPUT"

      - name: Run maven package
        run: mvn package

      - name: uploading generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-application
          path: target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: downloading artifacts
        uses: actions/download-artifact@v4
        with:
          name: java-application
          path: ./artifact

      - name: show downloaded artifacts
        run: ls -R ./artifact

      - name: deploying
        run: echo "Deploying $APP_NAME ${{ needs.build.outputs.app-version}}"

      - name: Github actions context
        run:  |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Test Github-secrets
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: echo "secret is available"


